        lengthCentimetres:
          oneOf:
          - $ref: '#/components/schemas/PositiveQuantity'
          - type: 'null'
        widthCentimetres:
          oneOf:
          - $ref: '#/components/schemas/PositiveQuantity'
          - type: 'null'
        heightCentimetres:
          oneOf:
          - $ref: '#/components/schemas/PositiveQuantity'
          - type: 'null'
    ShipmentState:
      type: string
