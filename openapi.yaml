          $ref: '#/components/schemas/PageLinks'
    WebhookEndpoint:
      type: object
      additionalProperties: false
      required:
      - endpointId
      - companyId
      - url
      - status
      - subscribedEventTypes
      - version
      - createdAt
      - updatedAt
      properties:
        endpointId:
          $ref: '#/components/schemas/Uuid'
        companyId:
          $ref: '#/components/schemas/Uuid'
        url:
          type: string
          format: uri
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
        subscribedEventTypes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEventType'
        previousSecretValidUntil:
          oneOf:
          - $ref: '#/components/schemas/InstantUtc'
          - type: 'null'
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/InstantUtc'
        updatedAt:
          $ref: '#/components/schemas/InstantUtc'
    WebhookEndpointPage:
      type: object
      required:
      - data
      - page
      - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
        page:
          $ref: '#/components/schemas/PageMetadata'
        links:
          $ref: '#/components/schemas/PageLinks'
    WebhookEndpointPatch:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
        subscribedEventTypes:
          type: array
          minItems: 1
          maxItems: 11
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEventType'
    WebhookEndpointRequest:
      type: object
      additionalProperties: false
      required:
      - url
      - subscribedEventTypes
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        subscribedEventTypes:
          type: array
          minItems: 1
          maxItems: 11
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEventType'
      example:
        url: https://merchant.example/webhooks/drophub
        subscribedEventTypes:
        - shipment.created
        - shipment.confirmed
    WebhookEndpointSecret:
      type: object
      additionalProperties: false
      required:
      - endpoint
      - signingSecret
      properties:
        endpoint:
          $ref: '#/components/schemas/WebhookEndpoint'
        signingSecret:
          type: string
          minLength: 43
          maxLength: 43
          writeOnly: true
          x-sensitive: true
          description: Returned exactly once as unpadded Base64URL. Decode it to 32 raw bytes before using
            it as the HMAC-SHA256 key.
    WebhookEventType:
      type: string
      enum:
      - shipment.created
      - shipment.confirmed
      - shipment.assigned
      - driver.accepted
      - driver.rejected
      - driver.arrived_at_pickup
      - shipment.picked_up
      - driver.arrived_at_dropoff
      - shipment.delivered
      - shipment.delivery_failed
      - shipment.cancelled
  securitySchemes:
    opaqueAccess:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: Short-lived random access credential backed by current server-side session state.
    oauthClientCredentials:
      type: oauth2
      description: OAuth 2.0 client-credentials flow for external machine-to-machine integrations.
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            shipments:read: Read Merchant-owned shipments
            shipments:write: Create and cancel Merchant-owned shipments
            webhooks:manage: Manage Merchant webhook endpoints, delivery history, and replay
    webSessionCookie:
      type: apiKey
      in: cookie
      name: dh_at
      description: Opaque httpOnly browser session cookie issued by the existing human authentication
        flows. Browsers send it automatically; Swagger UI cannot and does not persist or manufacture it.
tags:
- name: Authentication
  description: Authentication, sessions, the company a principal is, and merchant API credentials
- name: External Price Estimates
  description: OAuth-scoped transient route-distance and tariff calculation
- name: External Shipments
  description: OAuth-scoped Merchant shipment creation, lookup, and cancellation
- name: External Tracking
  description: Merchant-authenticated and privacy-minimized public tracking projections
- name: Sandbox
  description: Tenant-bound self-service fixture lifecycle, available only on the isolated sandbox deployment
- name: Webhook Endpoints
  description: Merchant webhook subscriptions, lifecycle, and signing-secret rotation
- name: Webhook Deliveries
  description: Durable webhook delivery history and replay
