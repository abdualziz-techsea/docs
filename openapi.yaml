        pickupLocationCode:
          type: string
          const: SANDBOX_PICKUP
        pickup:
          $ref: '#/components/schemas/SandboxFixtureCoordinate'
        delivery:
          $ref: '#/components/schemas/SandboxFixtureCoordinate'
        destinationCityCode:
          type: string
          const: RUH
          description: Use this fixture city code in price-estimate and shipment requests.
        sandboxDriverPhone:
          type: string
          pattern: ^05[0-9]{8}$
          description: Sandbox-only driver OTP identity used to progress the real canonical driver lifecycle.
        prerequisites:
          type: array
          items:
            $ref: '#/components/schemas/SandboxReadinessItem'
    SandboxReadinessItem:
      type: object
