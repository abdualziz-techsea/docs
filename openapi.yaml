        status:
          type: string
          enum:
          - PENDING
          - IN_FLIGHT
          - RETRY_WAIT
          - DELIVERED
          - DEAD_LETTER
        attemptCount:
          type: integer
          minimum: 0
          maximum: 12
        nextAttemptAt:
