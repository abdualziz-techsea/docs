openapi: 3.1.0
info:
  title: DropHub External API
  version: v2
  description: The public machine-to-machine integration surface of DropHub.
servers:
- url: https://api-test.drop-hub.com
  description: Sandbox. Isolated data and credentials.
- url: https://api.drop-hub.com
  description: Production. Production credentials only.
tags:
- name: Authentication
  description: OAuth 2.0 client-credentials token issuance
- name: External Shipments
  description: Create, read, and cancel your shipments
- name: External Tracking
  description: Partner and customer-safe shipment progress
- name: External Webhooks
  description: Your single signed shipment webhook
paths:
  /oauth/token:
    post:
      tags:
      - Authentication
      operationId: issueOAuthAccessToken
      summary: OAuth 2.0 client-credentials token issuance for machine integrations
      description: Standard RFC 6749 token endpoint. The client authenticates with HTTP Basic (preferred)
        or body client_id/client_secret parameters and receives a short-lived signed JWT bearer token.
        Responses use OAuth error semantics and are never stored.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
              - grant_type
              properties:
                grant_type:
                  type: string
                  enum:
                  - client_credentials
                client_id:
                  type: string
                  maxLength: 64
                client_secret:
                  type: string
                  maxLength: 128
      responses:
        '200':
          description: Issued access token
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - access_token
                - token_type
                - expires_in
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                    - Bearer
                  expires_in:
                    type: integer
                    format: int64
                    minimum: 60
        '400':
          description: invalid_request or unsupported_grant_type (OAuth JSON error)
        '401':
          description: invalid_client (OAuth JSON error)
        '429':
          description: rate_limited (OAuth JSON error with Retry-After)
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v2/external/shipments:
    post:
      tags:
      - External Shipments
      operationId: createExternalShipment
      summary: Create one shipment from a merchant reference and two location pins
      description: DropHub derives address and city context, route, coverage, pricing, carrier eligibility,
        service and dispatch decisions, SAR/payment defaults, lifecycle defaults, and the customer tracking
        URL. Idempotency-Key is optional because the merchant reference is the default key.
      security:
      - oauthClientCredentials:
        - shipments:write
      x-drophub-permission: shipments:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalShipmentRequest'
            examples:
              minimal:
                value:
                  reference: ORDER-1042
                  pickup:
                    latitude: 24.7136
                    longitude: 46.6753
                  destination:
                    latitude: 24.774265
                    longitude: 46.738586
                  recipient:
                    name: Noura
                    mobile: '0551234567'
              savedPickupCod:
                value:
                  reference: ORDER-1043
                  pickup:
                    savedLocationCode: MAIN
                  destination:
                    latitude: 24.774265
                    longitude: 46.738586
                  recipient:
                    name: Noura
                    mobile: '+966551234567'
                  parcel:
                    description: Small box
                    pieces: 1
                    weightKg: 2.4
                  codAmount: 125.0
      responses:
        '201':
          $ref: '#/components/responses/ExternalShipmentCreated'
        '200':
          $ref: '#/components/responses/ExternalShipmentResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /v2/external/shipments/{shipmentId}:
    get:
      tags:
      - External Shipments
      operationId: getExternalShipment
      summary: Read one merchant-owned shipment
      security:
      - oauthClientCredentials:
        - shipments:read
      x-drophub-permission: shipments:read
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          $ref: '#/components/responses/ExternalShipmentResource'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v2/external/shipments/{shipmentId}/tracking:
    get:
      tags:
      - External Tracking
      operationId: getExternalShipmentTracking
      summary: Read partner-safe shipment progress and available driver location
      security:
      - oauthClientCredentials:
        - shipments:read
      x-drophub-permission: shipments:read
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: Partner-safe tracking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalTracking'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v2/external/shipments/{shipmentId}/cancel:
    post:
      tags:
      - External Shipments
      operationId: cancelExternalShipment
      summary: Cancel before driver assignment
      security:
      - oauthClientCredentials:
        - shipments:write
      x-drophub-permission: shipments:write
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalShipmentCancellationRequest'
      responses:
        '200':
          $ref: '#/components/responses/ExternalShipmentResource'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v2/external/webhook:
    post:
      tags:
      - External Webhooks
      operationId: createExternalWebhook
      summary: Configure the merchant's single shipment webhook
      description: Returns the HMAC signing secret once. Events default to every partner event.
      security:
      - oauthClientCredentials:
        - webhooks:manage
      x-drophub-permission: webhooks:manage
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalWebhookRequest'
      responses:
        '201':
          $ref: '#/components/responses/ExternalWebhookSecretResource'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
    get:
      tags:
      - External Webhooks
      operationId: getExternalWebhook
      summary: Read the merchant's webhook configuration
      security:
      - oauthClientCredentials:
        - webhooks:manage
      x-drophub-permission: webhooks:manage
      responses:
        '200':
          $ref: '#/components/responses/ExternalWebhookResource'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    patch:
      tags:
      - External Webhooks
      operationId: updateExternalWebhook
      summary: Change callback URL, events, or pause state
      security:
      - oauthClientCredentials:
        - webhooks:manage
      x-drophub-permission: webhooks:manage
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalWebhookPatch'
      responses:
        '200':
          $ref: '#/components/responses/ExternalWebhookResource'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags:
      - External Webhooks
      operationId: deleteExternalWebhook
      summary: Remove the merchant's webhook configuration
      security:
      - oauthClientCredentials:
        - webhooks:manage
      x-drophub-permission: webhooks:manage
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Webhook removed
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v2/external/webhook/secret-rotations:
    post:
      tags:
      - External Webhooks
      operationId: rotateExternalWebhookSecret
      summary: Rotate the HMAC secret with a 24-hour overlap
      security:
      - oauthClientCredentials:
        - webhooks:manage
      x-drophub-permission: webhooks:manage
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/ExternalWebhookSecretResource'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /v2/public/tracking/{code}:
    get:
      tags:
      - External Tracking
      operationId: getPublicShipmentTracking
      summary: Read customer-safe progress through a time-bound bearer link
      security: []
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
      responses:
        '200':
          description: Customer-safe tracking without exact endpoints or identity
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTracking'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    oauthClientCredentials:
      type: oauth2
      description: OAuth 2.0 client-credentials flow for external machine-to-machine integrations.
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            shipments:read: Read Merchant-owned shipments
            shipments:write: Create and cancel Merchant-owned shipments
            webhooks:manage: Configure and rotate the merchant's single signed shipment webhook
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional. Retry safety is handled for you: when this header is absent DropHub derives
        the key from the reference you already send — the order number on a shipment create, the shipment
        id on a cancel — scoped to your merchant account. Two calls naming the same order are treated
        as one submission and the second returns the original result. Send your own key only if you want
        to control the replay window yourself; an explicit key always wins.'
      schema:
        type: string
        minLength: 16
        maxLength: 128
        example: merchant-order-20260822-0001
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong numeric entity tag returned by the preceding representation.
      schema:
        type: string
        pattern: ^"[0-9]+"$
    ShipmentId:
      name: shipmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AccessDenied:
      description: The token is valid but the credential lacks the required scope, or the resource belongs
        to another merchant. The machine code is `ACCESS_DENIED`. Retrying with the same credential will
        never succeed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuthenticationFailed:
      description: 'Authentication failed: the bearer token is missing, malformed, or expired.'
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.drop-hub.com/problems/authentication-required
            title: Authentication required
            status: 401
            detail: Authentication is required for this resource.
            instance: /v2/external/shipments/018f2d8a-1f00-7000-8000-000000000206
            code: AUTHENTICATION_REQUIRED
            timestamp: '2026-08-22T18:30:00Z'
            correlationId: 018f2d8a-1f00-7000-8000-000000000207
            requestId: 018f2d8a-1f00-7000-8000-000000000208
    BadRequest:
      description: The request syntax, path parameter, query parameter, or JSON document is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ExternalShipmentCreated:
      description: Shipment created; a retry of the same request returns 200 instead.
      headers:
        ETag:
          $ref: '#/components/headers/EntityTag'
        Location:
          schema:
            type: string
            format: uri-reference
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExternalShipment'
    ExternalShipmentResource:
      description: Minimal partner-safe shipment
      headers:
        ETag:
          $ref: '#/components/headers/EntityTag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExternalShipment'
    ExternalWebhookResource:
      description: The merchant's single webhook; secret material is absent.
      headers:
        ETag:
          $ref: '#/components/headers/EntityTag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExternalWebhook'
    ExternalWebhookSecretResource:
      description: Webhook plus the HMAC signing secret disclosed for creation or rotation.
      headers:
        ETag:
          $ref: '#/components/headers/EntityTag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExternalWebhookSecret'
    MethodNotAllowed:
      description: The method is not supported for this resource.
      headers:
        Allow:
          description: Methods supported by this resource.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: The supplied strong entity version is stale.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: A strong If-Match precondition is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProviderUnavailable:
      description: A DropHub dependency is temporarily unavailable and the operation failed closed rather
        than guessing. Retry with bounded exponential backoff and jitter.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The security operation is temporarily rate limited.
      headers:
        Retry-After:
          description: Suggested delay in seconds when available.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ResourceNotFound:
      description: Resource not found; existence is hidden across authorization boundaries.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StateConflict:
      description: Current state prevents the requested transition.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: The request fails strict syntax or semantic validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ExternalCoordinate:
      type: object
      additionalProperties: false
      required:
      - latitude
      - longitude
      properties:
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
    ExternalMapLocation:
      type: object
      additionalProperties: false
      required:
      - latitude
      - longitude
      - recordedAt
      - stale
      - ageSeconds
      properties:
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
        accuracyMetres:
          type:
          - number
          - 'null'
          minimum: 0
        recordedAt:
          $ref: '#/components/schemas/InstantUtc'
        stale:
          type: boolean
        ageSeconds:
          type: integer
          format: int64
          minimum: 0
    ExternalParcel:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 160
          default: Parcel
        pieces:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        weightKg:
          type: number
          exclusiveMinimum: 0
          default: 1
    ExternalPickup:
      description: Use either a saved pickup code or a coordinate pin.
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - savedLocationCode
        properties:
          savedLocationCode:
            type: string
            pattern: ^[A-Z0-9][A-Z0-9_-]{1,63}$
      - $ref: '#/components/schemas/ExternalCoordinate'
    ExternalPickupWindow:
      type: object
      additionalProperties: false
      required:
      - start
      - end
      properties:
        start:
          $ref: '#/components/schemas/InstantUtc'
        end:
          $ref: '#/components/schemas/InstantUtc'
    ExternalRecipient:
      type: object
      additionalProperties: false
      required:
      - name
      - mobile
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        mobile:
          type: string
          pattern: ^(?:05|5|\\+9665)[0-9]{8}$
          description: Saudi mobile; DropHub stores canonical +9665XXXXXXXX.
    ExternalShipment:
      type: object
      additionalProperties: false
      required:
      - id
      - reference
      - status
      - trackingUrl
      - createdAt
      - version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        reference:
          type: string
        status:
          $ref: '#/components/schemas/ExternalShipmentStatus'
        trackingUrl:
          type: string
          format: uri-reference
        codAmount:
          type:
          - number
          - 'null'
          format: decimal
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/InstantUtc'
        version:
          type: integer
          format: int64
          minimum: 0
    ExternalShipmentCancellationRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,47}$
          default: MERCHANT_REQUESTED
    ExternalShipmentRequest:
      type: object
      additionalProperties: false
      required:
      - reference
      - pickup
      - destination
      - recipient
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 128
          description: Merchant order/reference number and default idempotency key.
        pickup:
          $ref: '#/components/schemas/ExternalPickup'
        destination:
          $ref: '#/components/schemas/ExternalCoordinate'
        recipient:
          $ref: '#/components/schemas/ExternalRecipient'
        parcel:
          $ref: '#/components/schemas/ExternalParcel'
        codAmount:
          type: number
          format: decimal
          exclusiveMinimum: 0
          multipleOf: 0.01
          description: Omit for prepaid shipments; currency is SAR.
        pickupWindow:
          $ref: '#/components/schemas/ExternalPickupWindow'
    ExternalShipmentStatus:
      type: string
      enum:
      - CREATED
      - ASSIGNED
      - PICKED_UP
      - OUT_FOR_DELIVERY
      - DELIVERED
      - FAILED
      - CANCELLED
    ExternalTracking:
      type: object
      additionalProperties: false
      required:
      - id
      - reference
      - status
      - locationStatus
      - recommendedRefreshSeconds
      - history
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        reference:
          type: string
        status:
          $ref: '#/components/schemas/ExternalShipmentStatus'
        driverLocation:
          oneOf:
          - $ref: '#/components/schemas/ExternalMapLocation'
          - type: 'null'
        locationStatus:
          type: string
          enum:
          - NOT_ASSIGNED
          - WAITING_FOR_DRIVER_ACCEPTANCE
          - LOCATION_UNAVAILABLE
          - AVAILABLE
          - STALE
          - TERMINAL_NO_LIVE_LOCATION
        recommendedRefreshSeconds:
          type: integer
          format: int64
          minimum: 5
          maximum: 60
        history:
          type: array
          items:
            $ref: '#/components/schemas/ExternalTrackingStep'
    ExternalTrackingStep:
      type: object
      additionalProperties: false
      required:
      - status
      - at
      properties:
        status:
          $ref: '#/components/schemas/ExternalShipmentStatus'
        at:
          $ref: '#/components/schemas/InstantUtc'
    ExternalWebhook:
      type: object
      additionalProperties: false
      required:
      - endpointId
      - url
      - status
      - subscribedEventTypes
      - version
      - createdAt
      - updatedAt
      properties:
        endpointId:
          $ref: '#/components/schemas/Uuid'
        url:
          type: string
          format: uri
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
        subscribedEventTypes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ExternalWebhookEventType'
        previousSecretValidUntil:
          oneOf:
          - $ref: '#/components/schemas/InstantUtc'
          - type: 'null'
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/InstantUtc'
        updatedAt:
          $ref: '#/components/schemas/InstantUtc'
    ExternalWebhookEventType:
      type: string
      enum:
      - shipment.created
      - shipment.assigned
      - shipment.picked_up
      - shipment.out_for_delivery
      - shipment.delivered
      - shipment.failed
      - shipment.cancelled
    ExternalWebhookPatch:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
        events:
          type: array
          uniqueItems: true
          maxItems: 7
          items:
            $ref: '#/components/schemas/ExternalWebhookEventType'
    ExternalWebhookRequest:
      type: object
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          uniqueItems: true
          maxItems: 7
          items:
            $ref: '#/components/schemas/ExternalWebhookEventType'
          description: Omit to subscribe to every event.
    ExternalWebhookSecret:
      type: object
      additionalProperties: false
      required:
      - webhook
      - signingSecret
      properties:
        webhook:
          $ref: '#/components/schemas/ExternalWebhook'
        signingSecret:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
          x-sensitive: true
          description: Base64URL-encoded 32-byte HMAC-SHA256 secret, returned on create or rotation.
    InstantUtc:
      type: string
      format: date-time
      x-java-type: java.time.Instant
      x-postgresql-type: timestamptz(6)
      x-time-semantics: UTC-instant
    Latitude:
      type: number
      minimum: -90
      maximum: 90
      multipleOf: 1.0e-06
      x-java-type: java.math.BigDecimal
      x-postgresql-type: numeric(9,6)
      x-unit: decimal-degrees
    Longitude:
      type: number
      minimum: -180
      maximum: 180
      multipleOf: 1.0e-06
      x-java-type: java.math.BigDecimal
      x-postgresql-type: numeric(10,6)
      x-unit: decimal-degrees
    Problem:
      type: object
      description: RFC 9457 Problem Details with stable DropHub extensions
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - timestamp
      - correlationId
      - requestId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 128
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 512
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
        violations:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Violation'
      example:
        type: https://api.drop-hub.com/problems/access-denied
        title: Access denied
        status: 403
        detail: Access to this resource is denied.
        instance: /v2/external/shipments/018f2d8a-1f00-7000-8000-000000000206
        code: ACCESS_DENIED
        timestamp: '2026-08-22T18:30:00Z'
        correlationId: 018f2d8a-1f00-7000-8000-000000000207
        requestId: 018f2d8a-1f00-7000-8000-000000000208
    PublicTracking:
      type: object
      additionalProperties: false
      required:
      - status
      - locationStatus
      - recommendedRefreshSeconds
      - history
      properties:
        status:
          $ref: '#/components/schemas/ExternalShipmentStatus'
        driverLocation:
          description: Coarse position only; exact position and accuracy are never public.
          oneOf:
          - $ref: '#/components/schemas/ExternalMapLocation'
          - type: 'null'
        locationStatus:
          type: string
          enum:
          - NOT_ASSIGNED
          - WAITING_FOR_DRIVER_ACCEPTANCE
          - LOCATION_UNAVAILABLE
          - AVAILABLE
          - STALE
          - TERMINAL_NO_LIVE_LOCATION
        recommendedRefreshSeconds:
          type: integer
          format: int64
          minimum: 5
          maximum: 60
        history:
          type: array
          items:
            $ref: '#/components/schemas/ExternalTrackingStep'
    Uuid:
      type: string
      format: uuid
    Violation:
      type: object
      additionalProperties: false
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
          maxLength: 128
        code:
          type: string
          maxLength: 64
        message:
          type: string
          maxLength: 256
  headers:
    EntityTag:
      description: Strong numeric entity version for the next state-changing request.
      schema:
        type: string
        pattern: ^"[0-9]+"$
    WwwAuthenticate:
      description: Bearer challenge for an unauthenticated or invalid-token request.
      schema:
        type: string
        example: Bearer
