      - nextShipmentDispatchHeld
      - branchCode
      - pickupLocationCode
      - pickup
      - delivery
      - destinationCityCode
      - sandboxDriverPhone
      - prerequisites
      properties:
        generation:
          type: integer
          minimum: 1
        canCreateShipment:
          type: boolean
        nextShipmentDispatchHeld:
          type: boolean
