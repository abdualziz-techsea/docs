components:
  headers:
    EntityTag:
      description: Strong numeric entity version for the next state-changing request.
      schema:
        type: string
        pattern: ^"[0-9]+"$
    WwwAuthenticate:
      description: Bearer challenge for an unauthenticated or invalid-token request.
      schema:
        type: string
        example: Bearer
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Preferred response language when a localized representation is available.
      schema:
        type: string
        maxLength: 64
        example: en
    BoundedLimit:
      name: limit
      in: query
      required: false
      description: Maximum items to return. Default 25, maximum 100. Values outside 1..100 are rejected
        with 400; they are never clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated key scoped by the operation, Merchant company, and OAuth client; an
        exact replay returns the original result.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        example: merchant-order-20260822-0001
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong numeric entity tag returned by the preceding representation.
      schema:
        type: string
        pattern: ^"[0-9]+"$
    MerchantRegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation token from a previous page's page.nextCursor. Bound to the tenant,
        parent resource, filter and sort of the originating query; a cursor presented to a different query
        is rejected with 400 INVALID_CURSOR.
      schema:
        type: string
        maxLength: 256
        pattern: ^[A-Za-z0-9_-]{1,256}$
    RegistrationDocumentFilename:
      name: X-Document-Filename
      in: header
      required: true
      description: UTF-8 filename encoded as an RFC 3986 component; it is metadata, never a path.
      schema:
        type: string
        minLength: 1
        maxLength: 540
    RegistrationDocumentType:
      name: documentType
      in: path
      required: true
      schema:
        type: string
        enum:
        - NATIONAL_ADDRESS
        - COMMERCIAL_REGISTRATION
        - FREELANCE_CERTIFICATE
    RegistrationUploadCapability:
      name: Registration-Upload-Capability
      in: header
      required: true
      description: Short-lived opaque secret scoped to exactly one pending merchant registration.
      schema:
        type: string
        minLength: 32
    ShipmentId:
      name: shipmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookDeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookEndpointId:
      name: endpointId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AccessDenied:
      description: 'Access denied without exposing internal policy or resource ownership. The machine
        code is `ACCESS_DENIED`, except for two refusals that describe the caller''s own session and are
        therefore safe to name: `ASSURANCE_REQUIRED`, when the caller holds the authority but the session
        has not proved a second factor, and `REAUTHENTICATION_REQUIRED`, when the session is no longer
        fresh enough for the operation. Both are answered by proving the session again and retrying —
        see `POST /v2/company-authentication/assurance-elevations`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuthenticationFailed:
      description: Authentication failed without account, token, or tenant enumeration.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.drop-hub.com/problems/authentication-required
            title: Authentication required
            status: 401
            detail: Authentication is required for this resource.
            instance: /v2/external/shipments/018f2d8a-1f00-7000-8000-000000000206
            code: AUTHENTICATION_REQUIRED
            timestamp: '2026-08-22T18:30:00Z'
            correlationId: 018f2d8a-1f00-7000-8000-000000000207
            requestId: 018f2d8a-1f00-7000-8000-000000000208
    BadRequest:
      description: The request syntax, path parameter, query parameter, or JSON document is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DependencyUnavailable:
      description: Required qualified policy or evidence-custody dependency is unavailable; the operation
        fails closed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ExternalShipmentResource:
      description: Merchant-safe canonical shipment
      headers:
        ETag:
          $ref: '#/components/headers/EntityTag'
        Location:
          schema:
            type: string
            format: uri-reference
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExternalShipment'
    MethodNotAllowed:
      description: The method is not supported for this resource.
      headers:
        Allow:
          description: Methods supported by this resource.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: The supplied strong entity version is stale.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: A strong If-Match precondition is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProviderUnavailable:
      description: No qualified routing provider is configured; the operation fails closed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The security operation is temporarily rate limited.
      headers:
        Retry-After:
          description: Suggested delay in seconds when available.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RegistrationCapabilityExpired:
      description: The otherwise valid registration-scoped upload capability has expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RequestBodyTooLarge:
      description: The request body exceeds the endpoint's bounded size.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ResourceNotFound:
      description: Resource not found; existence is hidden across authorization boundaries.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A required qualified external provider is not configured or available.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StateConflict:
      description: Current state prevents the requested transition.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The request media type is not supported for this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: The request fails strict syntax or semantic validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WebhookEndpointResource:
      description: Merchant-owned endpoint; signing secret is absent
      headers:
        ETag:
          $ref: '#/components/headers/EntityTag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookEndpoint'
  schemas:
    Coordinate:
      type: object
      additionalProperties: false
      required:
      - latitude
      - longitude
      properties:
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
    CreateTrackingLinkRequest:
      type: object
      additionalProperties: false
      properties:
        expiresIn:
          type: string
          format: duration
          default: PT24H
    CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
      minLength: 3
      maxLength: 3
      x-java-type: java.util.Currency
      x-postgresql-type: char(3)
    ExternalBranch:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      - status
      - version
      properties:
        code:
          type: string
        name:
          type: string
        status:
          type: string
        version:
          $ref: '#/components/schemas/Version'
    ExternalBranchPage:
      type: object
      additionalProperties: false
      required:
      - data
      - page
      - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExternalBranch'
        page:
          $ref: '#/components/schemas/PageMetadata'
        links:
          $ref: '#/components/schemas/PageLinks'
    ExternalLocation:
      type: object
      additionalProperties: false
      required:
      - addressLine
      - cityCode
      - latitude
      - longitude
      properties:
        addressLine:
          type: string
          minLength: 1
          maxLength: 240
        cityCode:
          type: string
          pattern: ^[A-Z0-9_-]{2,32}$
        latitude:
          type: number
          format: decimal
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: decimal
          minimum: -180
          maximum: 180
    ExternalMerchantProfile:
      type: object
      additionalProperties: false
      required:
      - code
      - displayName
      - legalName
      - status
      properties:
        code:
          type: string
        displayName:
          type: string
        legalName:
          type: string
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - SUSPENDED
          - CLOSED
    ExternalPickupLocation:
      type: object
      additionalProperties: false
      required:
      - branchCode
      - code
      - name
      - addressLine
      - cityCode
      - latitude
      - longitude
      - timezone
      - status
      - requirements
      - version
      properties:
        branchCode:
          type: string
        code:
          type: string
        name:
          type: string
        addressLine:
          type: string
          minLength: 1
          maxLength: 240
        cityCode:
          type: string
          pattern: ^[A-Z0-9_-]{2,32}$
        latitude:
          type: number
          format: decimal
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: decimal
          minimum: -180
          maximum: 180
        timezone:
          type: string
        status:
          type: string
        requirements:
          type: array
          items:
            type: string
          uniqueItems: true
        version:
          $ref: '#/components/schemas/Version'
    ExternalPickupLocationPage:
      type: object
      additionalProperties: false
      required:
      - data
      - page
      - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExternalPickupLocation'
        page:
          $ref: '#/components/schemas/PageMetadata'
        links:
          $ref: '#/components/schemas/PageLinks'
    ExternalRecipient:
      type: object
      additionalProperties: false
      required:
      - name
      - phone
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          pattern: ^(?:\+?966|0)?5[0-9]{8}$
        alternateContactName:
          type:
          - string
          - 'null'
          maxLength: 120
        alternateContactPhone:
          type:
          - string
          - 'null'
          pattern: ^(?:\+?966|0)?5[0-9]{8}$
    ExternalShipment:
      type: object
      additionalProperties: false
      required:
      - shipmentId
      - shipmentNumber
      - externalReference
      - state
      - pickup
      - destination
      - recipientName
      - maskedRecipientPhone
      - totalWeightKilograms
      - declaredValue
      - codAmount
      - currency
      - paymentMethod
      - pickupWindowStart
      - pickupWindowEnd
      - items
      - requirements
      - createdAt
      - approvedAt
      - version
      properties:
        shipmentId:
          $ref: '#/components/schemas/Uuid'
        shipmentNumber:
          type: string
        externalReference:
          type:
          - string
          - 'null'
          maxLength: 128
        timelineMedia:
          type: array
          maxItems: 10
          description: Existing READY assets attached only to the resulting shipment.created event.
          items:
            $ref: '#/components/schemas/ShipmentTimelineMediaRequest'
        state:
          $ref: '#/components/schemas/ShipmentState'
        recipientName:
          type: string
        maskedRecipientPhone:
          type: string
          description: Only the final four digits are visible.
        totalWeightKilograms:
          type: number
        declaredValue:
          type: number
        codAmount:
          type: number
        currency:
          type: string
        paymentMethod:
          type: string
          enum:
          - PREPAID
          - COD
        pickupWindowStart:
          $ref: '#/components/schemas/InstantUtc'
        pickupWindowEnd:
          $ref: '#/components/schemas/InstantUtc'
        createdAt:
          $ref: '#/components/schemas/InstantUtc'
        approvedAt:
          oneOf:
          - $ref: '#/components/schemas/InstantUtc'
          - type: 'null'
        version:
          type: integer
          format: int64
          minimum: 0
        destination:
          $ref: '#/components/schemas/ExternalLocation'
        pickup:
          oneOf:
          - $ref: '#/components/schemas/ExternalLocation'
          - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentItem'
        requirements:
          type: array
          uniqueItems: true
          items:
            type: string
    ExternalShipmentCancellationRequest:
      type: object
