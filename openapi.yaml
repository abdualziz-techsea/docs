openapi: 3.1.0
info:
  title: DropHub External API
  version: v2
  description: DropHub API v2 for Merchant, shipping-company, shipment, and OAuth 2.0 integrations.
  contact:
    name: DropHub API Governance
  license:
    name: Proprietary
servers:
- url: https://api-test.drop-hub.com
  description: Sandbox deployment with isolated data and credentials.
- url: https://api.drop-hub.com
  description: Production deployment; production credentials only.
paths:
  /oauth/token:
    post:
      tags:
      - Authentication
      operationId: issueOAuthAccessToken
      summary: OAuth 2.0 client-credentials token issuance for machine integrations
      description: Standard RFC 6749 token endpoint. The client authenticates with HTTP Basic (preferred)
        or body client_id/client_secret parameters and receives a short-lived signed JWT bearer token.
        Responses use OAuth error semantics and are never stored.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
              - grant_type
              properties:
                grant_type:
                  type: string
                  enum:
                  - client_credentials
                client_id:
                  type: string
                  maxLength: 64
                client_secret:
                  type: string
                  maxLength: 128
      responses:
        '200':
          description: Issued access token
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - access_token
                - token_type
                - expires_in
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                    - Bearer
                  expires_in:
                    type: integer
                    format: int64
                    minimum: 60
        '400':
          description: invalid_request or unsupported_grant_type (OAuth JSON error)
        '401':
          description: invalid_client (OAuth JSON error)
        '429':
          description: rate_limited (OAuth JSON error with Retry-After)
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v2/merchant-registrations:
    post:
      tags:
      - Authentication
      security: []
      operationId: startMerchantRegistration
      summary: Start merchant self-service registration with an email OTP challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantRegistrationRequest'
      responses:
        '202':
          description: Neutral acknowledgement; the OTP challenge bound to the pending registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAcknowledgement'
        '200':
          description: Resend cooldown active; the existing pending registration is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAcknowledgement'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
      description: Starts a merchant registration and returns a short-lived opaque upload capability.
        The capability is valid only for the returned pending registration and is not an account or media
        credential.
  /v2/account-registrations/{registrationId}/documents:
    get:
      tags:
      - Authentication
      security: []
      operationId: listAccountRegistrationDocuments
      summary: List private evidence attached to one pending merchant registration
      parameters:
      - $ref: '#/components/parameters/MerchantRegistrationId'
      - $ref: '#/components/parameters/RegistrationUploadCapability'
      responses:
        '200':
          description: Document metadata only; no content or asset URL is exposed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistrationDocument'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '409':
          $ref: '#/components/responses/StateConflict'
        '410':
          $ref: '#/components/responses/RegistrationCapabilityExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v2/account-registrations/{registrationId}/documents/{documentType}:
    put:
      tags:
      - Authentication
      security: []
      operationId: putAccountRegistrationDocument
      summary: Upload or replace one private pending-registration document
      parameters:
      - $ref: '#/components/parameters/MerchantRegistrationId'
      - $ref: '#/components/parameters/RegistrationDocumentType'
      - $ref: '#/components/parameters/RegistrationUploadCapability'
      - $ref: '#/components/parameters/RegistrationDocumentFilename'
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
              maxLength: 1048576
          image/jpeg:
            schema:
              type: string
              format: binary
              maxLength: 1048576
          image/png:
            schema:
              type: string
              format: binary
              maxLength: 1048576
      responses:
        '200':
          description: Stored document metadata; the content remains private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationDocument'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '409':
          $ref: '#/components/responses/StateConflict'
        '410':
          $ref: '#/components/responses/RegistrationCapabilityExpired'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
      - Authentication
      security: []
      operationId: deleteAccountRegistrationDocument
      summary: Delete one document from a pending merchant registration
      parameters:
      - $ref: '#/components/parameters/MerchantRegistrationId'
      - $ref: '#/components/parameters/RegistrationDocumentType'
      - $ref: '#/components/parameters/RegistrationUploadCapability'
      responses:
        '204':
          description: The document is absent
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '409':
          $ref: '#/components/responses/StateConflict'
        '410':
          $ref: '#/components/responses/RegistrationCapabilityExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v2/shipping-company-registrations:
    post:
      tags:
      - Authentication
      security: []
      operationId: startShippingCompanyRegistration
      summary: Start shipping-company self-service registration with an email OTP challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingCompanyRegistrationRequest'
      responses:
        '202':
          description: Neutral acknowledgement; the OTP challenge bound to the pending registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAcknowledgement'
        '200':
          description: Resend cooldown active; the existing pending registration is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAcknowledgement'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
      description: Start shipping-company self-service registration with an email OTP challenge. A shipping
        company is registered through its own door and recorded in its own table; the two sign-ups do
        not share a request shape because they do not ask the same questions.
  /v2/account-registrations/{registrationId}/verifications:
    post:
      tags:
      - Authentication
      security: []
      operationId: verifyAccountRegistration
      summary: Verify the registration OTP and create identity, account and session atomically
      parameters:
      - name: registrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationVerificationRequest'
      responses:
        '201':
          description: Account created and one session issued; httpOnly cookies set for browsers
          headers:
            Set-Cookie:
              description: httpOnly session cookies for browser clients
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationSession'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
      description: Verify the registration OTP and create identity, account and session atomically.
  /v2/merchant-api-credential:
    get:
      tags:
      - Authentication
      operationId: getMerchantApiCredential
      x-drophub-permission: integration.api-credential:read-own
      summary: Read this merchant's own Direct API credential
      security:
      - opaqueAccess: []
      responses:
        '200':
          description: The credential as it stands. Never carries a secret.
          headers:
            ETag:
              $ref: '#/components/headers/EntityTag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantApiCredential'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
      description: The merchant is its own API client, so the credential is addressed by the session rather
        than by a client id. A merchant that has never issued one is answered 404.
    post:
      tags:
      - Authentication
      operationId: issueMerchantApiCredential
      x-drophub-permission: integration.api-credential:manage-own
      summary: Issue this merchant's Direct API credential
      security:
      - opaqueAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantApiCredentialRequest'
      responses:
        '201':
          description: Credential issued. The secret is disclosed here and never again.
          headers:
            ETag:
              $ref: '#/components/headers/EntityTag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedMerchantApiSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
      description: One active credential per merchant. A second call while it is active is a conflict.
        After revocation this same operation cleanly reissues a new client id and one-time secret.
    delete:
      tags:
      - Authentication
      operationId: revokeMerchantApiCredential
      x-drophub-permission: integration.api-credential:manage-own
      summary: Withdraw this merchant's Direct API credential
      security:
      - opaqueAccess: []
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Credential withdrawn. New token issuance and already-issued bearer-token authorization
            stop immediately.
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
      description: Withdraw the credential. Access-policy checks invalidate already-issued bearer tokens
        immediately.
  /v2/merchant-api-credential/secret-rotations:
    post:
      tags:
      - Authentication
      operationId: rotateMerchantApiSecret
      x-drophub-permission: integration.api-credential:manage-own
      summary: Replace the secret, keeping the old one until it retires
      security:
      - opaqueAccess: []
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: New secret disclosed once. The superseded secret keeps working for 24 hours.
          headers:
            ETag:
              $ref: '#/components/headers/EntityTag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedMerchantApiSecret'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
      description: Rotation keeps an overlap window so a merchant can rotate and redeploy without a gap
        in which its integration is refused.
  /v2/external/sandbox/bootstrap:
    post:
      tags:
      - Sandbox
      operationId: bootstrapExternalMerchantSandbox
      summary: Idempotently provision this merchant's complete sandbox fixture
      description: Sandbox deployment only. Creates or repairs a tenant-exclusive merchant, internal carrier,
        coverage, driver, and canonical location fixture. It never accepts hidden identifiers or changes
        another tenant.
      security:
      - webSessionCookie: []
      - oauthClientCredentials:
        - shipments:write
      responses:
        '200':
          description: Current readiness after provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxReadiness'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /v2/external/sandbox/readiness:
    get:
      tags:
      - Sandbox
      operationId: getExternalMerchantSandboxReadiness
      summary: Read this merchant's sandbox readiness checklist
      security:
      - webSessionCookie: []
      - oauthClientCredentials:
        - shipments:write
      responses:
        '200':
          description: Tenant-bound readiness and routable fixture coordinates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxReadiness'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /v2/external/sandbox/reset:
    post:
      tags:
      - Sandbox
      operationId: resetExternalMerchantSandbox
      summary: Reset only the calling merchant's sandbox integration fixtures
      description: Explicitly revokes this tenant's public tracking links and webhook endpoints, repairs
        its fixture prerequisites, increments the generation, and preserves canonical immutable shipment
        history. Shared/global platform configuration and other tenants are untouched.
      security:
      - webSessionCookie: []
      - oauthClientCredentials:
        - shipments:write
      responses:
        '200':
          description: Current readiness after reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxReadiness'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
  /v2/external/sandbox/dispatch-holds:
    post:
      tags:
      - Sandbox
      operationId: holdNextExternalMerchantSandboxDispatch
      summary: Keep the next sandbox shipment before the driver-offer boundary
      description: Sandbox deployment only. Idempotently arms one tenant-bound hold. The next shipment
        consumes it atomically and remains PENDING_APPROVAL with no driver offer, allowing the merchant
        cancellation boundary to be exercised deterministically.
      security:
      - webSessionCookie: []
      - oauthClientCredentials:
        - shipments:write
      responses:
        '200':
          description: Readiness with nextShipmentDispatchHeld set to true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxReadiness'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
  /v2/external/shipment-price-estimates:
    post:
      tags:
      - External Price Estimates
      operationId: calculateExternalShipmentPrice
      summary: Calculate what this merchant is charged for a delivery
      description: Calculates authoritative route distance and returns the delivery price agreed with
        this merchant. DropHub internally verifies an eligible carrier and available driver; merchants
        never select or receive a carrier identifier. No calculation is persisted.
      security:
      - oauthClientCredentials:
        - shipments:write
      x-drophub-permission: shipments:write
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalShipmentPriceEstimateRequest'
      responses:
        '200':
          description: Current transient price estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalShipmentPriceEstimate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v2/external/shipments:
    post:
      tags:
      - External Shipments
      operationId: createExternalMerchantShipment
      summary: Create or replay a canonical Merchant shipment
      description: Resolves the authoritative route, internally selects an eligible service and driver,
        and freezes the merchant commercial terms. Carrier identity and scoring are never merchant inputs.
        `externalReference` is unique per Merchant company.
      security:
      - oauthClientCredentials:
        - shipments:write
      x-drophub-permission: shipments:write
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalShipmentRequest'
      responses:
        '200':
          $ref: '#/components/responses/ExternalShipmentResource'
        '201':
          $ref: '#/components/responses/ExternalShipmentResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    get:
      tags:
      - External Shipments
      operationId: listExternalMerchantShipments
      summary: List or reconcile Merchant shipments
      security:
      - oauthClientCredentials:
        - shipments:read
      x-drophub-permission: shipments:read
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/BoundedLimit'
      - $ref: '#/components/parameters/PageCursor'
      - name: state
        in: query
        schema:
          $ref: '#/components/schemas/ShipmentState'
      - name: externalReference
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: Merchant shipment page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalShipmentPage'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '429':
          $ref: '#/components/responses/RateLimited'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
      description: List or reconcile Merchant shipments.
  /v2/external/shipments/{shipmentId}:
    get:
      tags:
      - External Shipments
      operationId: getExternalMerchantShipment
      security:
      - oauthClientCredentials:
        - shipments:read
      x-drophub-permission: shipments:read
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          $ref: '#/components/responses/ExternalShipmentResource'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
      summary: Get external merchant shipment
      description: Get external merchant shipment.
  /v2/external/shipments/{shipmentId}/cancel:
    post:
      tags:
      - External Shipments
      operationId: cancelExternalMerchantShipment
      summary: Cancel an unassigned shipment
      description: Atomic with driver assignment. Once any driver offer/assignment exists this returns
        409 SHIPMENT_ALREADY_ASSIGNED.
      security:
      - oauthClientCredentials:
        - shipments:write
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalShipmentCancellationRequest'
      responses:
        '200':
          $ref: '#/components/responses/ExternalShipmentResource'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v2/external/shipments/{shipmentId}/tracking:
    get:
      tags:
      - External Tracking
      operationId: getExternalShipmentTracking
      security:
      - oauthClientCredentials:
        - shipments:read
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: Privacy-controlled canonical tracking projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalTracking'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /v2/external/shipments/{shipmentId}/tracking-links:
    post:
      tags:
      - External Tracking
      operationId: createExternalShipmentTrackingLink
      security:
      - oauthClientCredentials:
        - shipments:write
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrackingLinkRequest'
      responses:
        '201':
          description: One-time opaque public tracking URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingLink'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /v2/external/shipments/{shipmentId}/tracking-links/{linkId}:
    delete:
      tags:
      - External Tracking
      operationId: revokeExternalShipmentTrackingLink
      security:
      - oauthClientCredentials:
        - shipments:write
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - name: linkId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Public tracking link revoked
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v2/external/webhook-endpoints:
    post:
      tags:
      - Webhook Endpoints
      operationId: createMerchantWebhookEndpoint
      description: Returns the signing secret exactly once. Production destinations must be public HTTPS
        and pass DNS/IP SSRF validation.
      security:
      - oauthClientCredentials:
        - webhooks:manage
      x-drophub-permission: webhooks:manage
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointRequest'
      responses:
        '201':
          description: Endpoint and one-time secret
          headers:
            ETag:
              $ref: '#/components/headers/EntityTag'
            Location:
              schema:
                type: string
