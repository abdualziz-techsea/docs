openapi: 3.1.0
info:
  title: DropHub External API
  version: v2
  description: The public machine-to-machine integration surface of DropHub.
servers:
- url: https://api-test.drop-hub.com
  description: Sandbox. Isolated data and credentials.
- url: https://api.drop-hub.com
  description: Production. Production credentials only.
tags:
- name: Authentication
  description: Authentication, sessions, the company a principal is, and merchant API credentials
- name: External Shipments
  description: OAuth-scoped Merchant shipment creation, lookup, and cancellation
- name: External Tracking
  description: Merchant-authenticated and privacy-minimized public tracking projections
- name: External Webhooks
- name: Sandbox
  description: Tenant-bound self-service fixture lifecycle, available only on the isolated sandbox deployment
paths:
  /api/v2/oauth/token:
    post:
      tags:
      - Authentication
      operationId: issueOAuthAccessToken
      summary: OAuth 2.0 client-credentials token issuance for machine integrations
      description: Standard RFC 6749 token endpoint. The client authenticates with HTTP Basic (preferred)
        or body client_id/client_secret parameters and receives a short-lived signed JWT bearer token.
        Responses use OAuth error semantics and are never stored.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
              - grant_type
              properties:
                grant_type:
                  type: string
                  enum:
                  - client_credentials
                client_id:
                  type: string
                  maxLength: 64
                client_secret:
                  type: string
                  maxLength: 128
      responses:
        '200':
          description: Issued access token
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - access_token
                - token_type
                - expires_in
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                    - Bearer
                  expires_in:
                    type: integer
                    format: int64
                    minimum: 60
        '400':
          description: invalid_request or unsupported_grant_type (OAuth JSON error)
        '401':
          description: invalid_client (OAuth JSON error)
        '429':
          description: rate_limited (OAuth JSON error with Retry-After)
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/v2/oauth/jwks.json:
    get:
      tags:
      - Authentication
      operationId: getOAuthVerificationKeys
      summary: Public OAuth token verification keys (RFC 7517)
      responses:
        '200':
          description: JSON Web Key Set of public verification keys
          content:
            application/json:
              schema:
                type: object
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
      description: Public OAuth token verification keys (RFC 7517).
  /api/v2/external/sandbox/bootstrap:
    post:
      tags:
      - Sandbox
      operationId: bootstrapExternalMerchantSandbox
      summary: Idempotently provision this merchant's complete sandbox fixture
      description: Sandbox deployment only. Creates or repairs a tenant-exclusive merchant, internal carrier,
        coverage, driver, and canonical location fixture. It never accepts hidden identifiers or changes
        another tenant.
      security:
      - oauthClientCredentials:
        - shipments:write
      responses:
        '200':
          description: Current readiness after provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxReadiness'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /api/v2/external/sandbox/readiness:
    get:
      tags:
      - Sandbox
      operationId: getExternalMerchantSandboxReadiness
      summary: Read this merchant's sandbox readiness checklist
      security:
      - oauthClientCredentials:
        - shipments:write
      responses:
        '200':
          description: Tenant-bound readiness and routable fixture coordinates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxReadiness'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /api/v2/external/sandbox/reset:
    post:
      tags:
      - Sandbox
      operationId: resetExternalMerchantSandbox
      summary: Reset only the calling merchant's sandbox integration fixtures
      description: Explicitly revokes this tenant's public tracking links and webhook endpoints, repairs
        its fixture prerequisites, increments the generation, and preserves canonical immutable shipment
        history. Shared/global platform configuration and other tenants are untouched.
      security:
      - oauthClientCredentials:
        - shipments:write
      responses:
        '200':
          description: Current readiness after reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxReadiness'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
  /api/v2/external/sandbox/dispatch-holds:
    post:
      tags:
      - Sandbox
      operationId: holdNextExternalMerchantSandboxDispatch
      summary: Keep the next sandbox shipment before the driver-offer boundary
      description: Sandbox deployment only. Idempotently arms one tenant-bound hold. The next shipment
        consumes it atomically and remains PENDING_APPROVAL with no driver offer, allowing the merchant
        cancellation boundary to be exercised deterministically.
      security:
      - oauthClientCredentials:
        - shipments:write
      responses:
        '200':
          description: Readiness with nextShipmentDispatchHeld set to true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxReadiness'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
  /api/v2/external/quotes:
    post:
      tags:
      - External Shipments
      operationId: createExternalShipmentQuote
      summary: Quote a merchant delivery fee that is honoured for 15 minutes
      description: Prices the road route between the two points with the merchant's current tariff, exactly
        as shipment creation does, and returns a quoteId valid until expiresAt (15 minutes). A shipment
        created with that quoteId before it expires, for the same pickup and destination points, is charged
        this price even if the tariff changes in between. A quote prices at most one shipment. Without
        a quoteId, creation prices the shipment again. To quote a shipment that will be created with pickup.savedLocationCode,
        quote with that location's merchantId, branchId and pickupLocationId (from GET /api/v2/external/pickup-locations);
        a quote priced from a different pickup point is refused at creation with QUOTE_MISMATCH. No reservation
        of driver capacity is made; check availability with /api/v2/external/serviceability.
      security:
      - oauthClientCredentials:
        - quotes:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentPriceEstimateRequest'
      responses:
        '200':
          description: Current quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentPriceEstimate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v2/external/shipments:
    post:
      tags:
      - External Shipments
      operationId: createExternalShipment
      summary: Create one shipment from a merchant reference and two location pins
      description: 'DropHub derives address and city context, route, coverage, pricing, carrier eligibility,
        service and dispatch decisions, SAR/payment defaults, lifecycle defaults, and the customer tracking
        URL. Idempotency-Key is optional because the merchant reference is the default key. With quoteId
        the delivery fee is the quoted one. Quote refusals: 422 QUOTE_NOT_FOUND (unknown or another merchant''s),
        422 QUOTE_EXPIRED, 422 QUOTE_MISMATCH (different pickup or destination point), 409 QUOTE_ALREADY_USED
        (already priced another shipment). An idempotent replay of the same request returns the original
        shipment with 200.'
      security:
      - oauthClientCredentials:
        - shipments:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalShipmentRequest'
            examples:
              minimal:
                value:
                  reference: ORDER-1042
                  pickup:
                    latitude: 24.7136
                    longitude: 46.6753
                  destination:
                    latitude: 24.774265
                    longitude: 46.738586
                  recipient:
                    name: Noura
                    mobile: '0551234567'
              savedPickupCod:
                value:
                  reference: ORDER-1043
                  pickup:
                    savedLocationCode: MAIN
                  destination:
                    latitude: 24.774265
                    longitude: 46.738586
                  recipient:
                    name: Noura
                    mobile: '+966551234567'
                  parcel:
                    description: Small box
                    pieces: 1
                    weightKg: 2.4
                  codAmount: 125.0
              quoted:
                value:
                  reference: ORDER-1044
                  quoteId: 01a190b4-c53d-7143-a6e2-5ef1e6b4c697
                  pickup:
                    savedLocationCode: MAIN
                  destination:
                    latitude: 24.774265
                    longitude: 46.738586
                  recipient:
                    name: Noura
                    mobile: '0551234567'
      responses:
        '201':
          $ref: '#/components/responses/ExternalShipmentCreated'
        '200':
          $ref: '#/components/responses/ExternalShipmentResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /api/v2/external/serviceability:
    post:
      tags:
      - External Shipments
      operationId: checkExternalServiceability
      summary: Check current pickup, merchant coverage and carrier availability
      description: A point-in-time checkout decision, not a capacity reservation or shipment creation
        guarantee.
      security:
      - oauthClientCredentials:
        - quotes:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalServiceabilityRequest'
      responses:
        '200':
          description: Current serviceability decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalServiceability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v2/external/shipments/{shipmentId}:
    get:
      tags:
      - External Shipments
      operationId: getExternalShipment
      summary: Read one merchant-owned shipment
      security:
      - oauthClientCredentials:
        - shipments:read
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          $ref: '#/components/responses/ExternalShipmentResource'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags:
      - External Shipments
      operationId: changeExternalShipment
      summary: Change the destination or recipient of an own Direct API shipment
      description: 'If-Match carries the shipment version from its ETag. A new destination is accepted
        before pickup (CREATED, ASSIGNED, NO_DRIVER_AVAILABLE) when the merchant''s agreement prices the
        new route exactly as the frozen delivery fee; the fee is never restated. As at creation, any destination
        is accepted; serviceability is the advisory coverage check. A new recipient is accepted until
        the shipment is delivered, failed or cancelled. The assigned driver keeps the assignment and sees
        the new destination; a shipment.updated webhook is sent. A new pickupWindow is accepted until
        a driver accepts the shipment and must fit the pickup location''s opening hours (422 PICKUP_OUTSIDE_OPERATING_HOURS);
        the price does not depend on it. Shipments that came from a store platform (Salla, Zid) are changed
        in that platform: 409 SHIPMENT_CHANGE_NOT_SUPPORTED. Other refusals: 412 PRECONDITION_FAILED (stale
        If-Match), 409 SHIPMENT_CHANGE_NOT_ALLOWED (state), 409 SHIPMENT_PRICE_WOULD_CHANGE, 428 PRECONDITION_REQUIRED
        (no If-Match), 422 SHIPMENT_VALIDATION_FAILED (nothing to change).'
      security:
      - oauthClientCredentials:
        - shipments:write
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          example: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalShipmentChangeRequest'
            examples:
              newDestinationAndRecipient:
                value:
                  destination:
                    latitude: 24.775
                    longitude: 46.739
                  recipient:
                    name: Noura
                    mobile: 0559876543
      responses:
        '200':
          $ref: '#/components/responses/ExternalShipmentResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v2/external/shipments/{shipmentId}/incidents:
    get:
      tags:
      - External Shipments
      operationId: listExternalShipmentIncidents
      summary: Loss, damage and failed-delivery incidents of an owned shipment
      security:
      - oauthClientCredentials:
        - shipments:read
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: Incidents, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalIncident'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /api/v2/external/shipments/{shipmentId}/incidents/evidence/{assetId}:
    get:
      tags:
      - External Shipments
      operationId: getExternalShipmentIncidentEvidence
      summary: Read one evidence file attached to an incident of an owned shipment
      security:
      - oauthClientCredentials:
        - shipments:read
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - name: assetId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Evidence bytes; Content-Type is the stored media type, Cache-Control is no-store
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /api/v2/external/coverage/areas:
    get:
      tags:
      - External Shipments
      operationId: getExternalDeliveryArea
      summary: Where DropHub's delivery companies deliver, combined
      description: The union of the eligible delivery companies' city and district coverage, without naming
        any company. The merchant's own coverage zones still apply at serviceability and creation; check
        a concrete pair of points with POST /api/v2/external/serviceability.
      security:
      - oauthClientCredentials:
        - quotes:write
      responses:
        '200':
          description: Combined delivery area
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDeliveryArea'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
  /api/v2/external/pickup-locations:
    get:
      tags:
      - External Shipments
      operationId: listExternalPickupLocations
      summary: List the merchant's pickup locations and their collection hours
      security:
      - oauthClientCredentials:
        - shipments:read
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 256
      responses:
        '200':
          description: One page of pickup locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalPickupLocationPage'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
  /api/v2/external/sandbox/shipments/{shipmentId}/delivery-failures:
    post:
      tags:
      - Sandbox
      operationId: failExternalSandboxDelivery
      summary: Have the sandbox driver report a delivery as failed
      description: Sandbox deployments only (404 SANDBOX_ONLY elsewhere). The disposable driver that accepted
        this shipment reports it undeliverable through the real driver operation, so the shipment moves
        to FAILED with the given reason and the shipment.failed webhook is sent. Every other sandbox step
        (assignment, pickup, delivery with photo proof) is performed automatically by the sandbox driver.
        409 SANDBOX_DRIVER_NOT_CARRYING_SHIPMENT until a sandbox driver has accepted the shipment, and
        once it is delivered, failed or cancelled.
      security:
      - oauthClientCredentials:
        - shipments:write
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxDeliveryFailureRequest'
      responses:
        '200':
          $ref: '#/components/responses/ExternalShipmentResource'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v2/external/shipments/{shipmentId}/cancel:
    post:
      tags:
      - External Shipments
      operationId: cancelExternalShipment
      summary: Cancel before physical pickup
      description: Allows cancellation while pending, ready, without a driver, offered or accepted, atomically
        withdrawing live driver offers. Once the parcel is picked up, returns 409 with SHIPMENT_RETURN_REQUIRED;
        create a separate return shipment instead. Delivery and custody facts are preserved.
      security:
      - oauthClientCredentials:
        - shipments:write
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalShipmentCancellationRequest'
      responses:
        '200':
          $ref: '#/components/responses/ExternalShipmentResource'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v2/external/shipments/{shipmentId}/proof:
    get:
      tags:
      - External Shipments
      operationId: getExternalShipmentProof
      summary: Read protected proof metadata for an owned shipment
      security:
      - oauthClientCredentials:
        - shipments:read
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: Available evidence metadata and authenticated content paths
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalProof'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /api/v2/external/shipments/{shipmentId}/proof/{stage}/content:
    get:
      tags:
      - External Shipments
      operationId: getExternalShipmentProofContent
      summary: Read one protected proof asset for an owned shipment
      security:
      - oauthClientCredentials:
        - shipments:read
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      - name: stage
        in: path
        required: true
        schema:
          type: string
          enum:
          - pickup
          - delivery
      responses:
        '200':
          description: Proof bytes; Content-Type is the stored media type, Cache-Control is no-store
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /api/v2/external/shipments/{shipmentId}/tracking:
    get:
      tags:
      - External Tracking
      operationId: getExternalShipmentTracking
      summary: Read partner-safe shipment progress and available driver location
      security:
      - oauthClientCredentials:
        - tracking:read
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: Partner-safe tracking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalTracking'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v2/public/tracking/{code}:
    get:
      tags:
      - External Tracking
      operationId: getPublicShipmentTracking
      summary: Read customer-safe progress through a time-bound bearer link
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
      responses:
        '200':
          description: Customer-safe tracking without exact endpoints or identity
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTracking'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v2/public/tracking/waybills/{shipmentNumber}:
    get:
      tags:
      - External Tracking
      operationId: getPublicWaybillTracking
      summary: Read customer-safe progress through the waybill number printed on the label
      description: Opened with the number printed on the label, which is what a customer actually has.
        A link is handed to one person; a number travels on a parcel and is read out over the phone, so
        this answers only where the parcel has got to, on the same rounded public projection an opaque
        link opens.
      parameters:
      - name: shipmentNumber
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9-]{4,64}$
      responses:
        '200':
          description: Customer-safe tracking without exact endpoints or identity
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTracking'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v2/external/webhook:
    post:
      tags:
      - External Webhooks
      operationId: createExternalWebhook
      summary: Configure the merchant's single shipment webhook
      description: Returns the HMAC signing secret once. Events default to every partner event.
      security:
      - oauthClientCredentials:
        - webhooks:manage
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalWebhookRequest'
      responses:
        '201':
          $ref: '#/components/responses/ExternalWebhookSecretResource'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
    get:
      tags:
      - External Webhooks
      operationId: getExternalWebhook
      summary: Read the merchant's webhook configuration
      security:
      - oauthClientCredentials:
        - webhooks:manage
      responses:
        '200':
          $ref: '#/components/responses/ExternalWebhookResource'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    patch:
      tags:
      - External Webhooks
      operationId: updateExternalWebhook
      summary: Change callback URL, events, or pause state
      security:
      - oauthClientCredentials:
        - webhooks:manage
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalWebhookPatch'
      responses:
        '200':
          $ref: '#/components/responses/ExternalWebhookResource'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags:
      - External Webhooks
      operationId: deleteExternalWebhook
      summary: Remove the merchant's webhook configuration
      security:
      - oauthClientCredentials:
        - webhooks:manage
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Webhook removed
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v2/external/webhook/secret-rotations:
    post:
      tags:
      - External Webhooks
      operationId: rotateExternalWebhookSecret
      summary: Rotate the HMAC secret with a 24-hour overlap
      security:
      - oauthClientCredentials:
        - webhooks:manage
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/ExternalWebhookSecretResource'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
components:
  headers:
    EntityTag:
      description: Strong numeric entity version for the next state-changing request.
      schema:
        type: string
        pattern: ^"[0-9]+"$
    WwwAuthenticate:
      description: Bearer challenge for an unauthenticated or invalid-token request.
      schema:
        type: string
        example: Bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional. Retry safety is handled for you: when this header is absent DropHub derives
        the key from the reference you already send — the order number on a shipment create, the shipment
        id on a cancel — scoped to your merchant account. Two calls naming the same order are treated
        as one submission and the second returns the original result. Send your own key only if you want
        to control the replay window yourself; an explicit key always wins.'
      schema:
        type: string
        minLength: 16
        maxLength: 128
        example: merchant-order-20260822-0001
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong numeric entity tag returned by the preceding representation.
      schema:
        type: string
        pattern: ^"[0-9]+"$
    ShipmentId:
      name: shipmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AccessDenied:
      description: Access denied without exposing internal policy or resource ownership. No operation
        requires a second factor or a fresher live session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuthenticationFailed:
      description: Authentication failed without account, token, or tenant enumeration.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.drophub.example/problems/authentication-required
            title: Authentication required
            status: 401
            detail: Authentication is required for this resource.
            instance: /api/v2/external/shipments/018f2d8a-1f00-7000-8000-000000000206
            code: AUTHENTICATION_REQUIRED
            timestamp: '2026-08-22T18:30:00Z'
            correlationId: 018f2d8a-1f00-7000-8000-000000000207
            requestId: 018f2d8a-1f00-7000-8000-000000000208
    BadRequest:
      description: The request syntax, path parameter, query parameter, or JSON document is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ExternalShipmentCreated:
      description: Shipment created; a retry of the same request returns 200 instead.
      headers:
        ETag:
          $ref: '#/components/headers/EntityTag'
        Location:
          schema:
            type: string
            format: uri-reference
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExternalShipment'
    ExternalShipmentResource:
      description: Minimal partner-safe shipment
      headers:
        ETag:
          $ref: '#/components/headers/EntityTag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExternalShipment'
    ExternalWebhookResource:
      description: The merchant's single webhook; secret material is absent.
      headers:
        ETag:
          $ref: '#/components/headers/EntityTag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExternalWebhook'
    ExternalWebhookSecretResource:
      description: Webhook plus the HMAC signing secret disclosed for creation or rotation.
      headers:
        ETag:
          $ref: '#/components/headers/EntityTag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExternalWebhookSecret'
    MethodNotAllowed:
      description: The method is not supported for this resource.
      headers:
        Allow:
          description: Methods supported by this resource.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: The supplied strong entity version is stale.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: A strong If-Match precondition is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProviderUnavailable:
      description: No qualified routing provider is configured; the operation fails closed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The security operation is temporarily rate limited.
      headers:
        Retry-After:
          description: Suggested delay in seconds when available.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ResourceNotFound:
      description: Resource not found; existence is hidden across authorization boundaries.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A required qualified external provider is not configured or available.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StateConflict:
      description: Current state prevents the requested transition.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: The request fails strict syntax or semantic validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ExternalAssignedDriver:
      type: object
      additionalProperties: false
      description: The driver who accepted the shipment, while it is still moving. Phone number, surname,
        licence and identifiers are not disclosed; contact goes through the shipment conversation.
      properties:
        firstName:
          type:
          - string
          - 'null'
        vehicleType:
          type:
          - string
          - 'null'
          enum:
          - MOTORCYCLE
          - CAR
          - VAN
          - TRUCK
          - null
        vehiclePlate:
          type:
          - string
          - 'null'
    ExternalCoordinate:
      type: object
      additionalProperties: false
      required:
      - latitude
      - longitude
      properties:
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
    ExternalDeliveryArea:
      type: object
      additionalProperties: false
      required:
      - scope
      - cities
      properties:
        scope:
          type: string
          enum:
          - UNRESTRICTED
          - AREAS
          - NONE
          description: UNRESTRICTED when at least one eligible delivery company has no area limit; AREAS
            lists the combined cities and districts; NONE when no company is available.
        cities:
          type: array
          items:
            type: object
            properties:
              cityId:
                $ref: '#/components/schemas/Uuid'
              cityCode:
                type: string
              nameAr:
                type:
                - string
                - 'null'
              nameEn:
                type:
                - string
                - 'null'
              wholeCity:
                type: boolean
              districts:
                type: array
                items:
                  type: object
                  properties:
                    districtId:
                      $ref: '#/components/schemas/Uuid'
                    nameAr:
                      type:
                      - string
                      - 'null'
                    nameEn:
                      type:
                      - string
                      - 'null'
    ExternalIncident:
      type: object
      additionalProperties: false
      required:
      - type
      - status
      - reportedAt
      - evidencePaths
      properties:
        type:
          type: string
          enum:
          - LOST
          - DAMAGED
          - DELIVERY_FAILED
        status:
          type: string
          enum:
          - OPEN
          - RESOLVED
          - FINAL
          description: OPEN while operations are on hold for the report; RESOLVED once released; FINAL
            for a failed delivery.
        reasonCode:
          type:
          - string
          - 'null'
          description: Structured failure reason; carrier free text is never returned.
        reportedAt:
          $ref: '#/components/schemas/InstantUtc'
        evidencePaths:
          type: array
          items:
            type: string
            format: uri-reference
    ExternalMapLocation:
      type: object
      additionalProperties: false
      required:
      - latitude
      - longitude
      - recordedAt
      - stale
      - ageSeconds
      properties:
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
        accuracyMetres:
          type:
          - number
          - 'null'
          minimum: 0
        recordedAt:
          $ref: '#/components/schemas/InstantUtc'
        stale:
          type: boolean
        ageSeconds:
          type: integer
          format: int64
          minimum: 0
    ExternalParcel:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 160
          default: Parcel
        pieces:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        weightKg:
          type: number
          exclusiveMinimum: 0
          default: 1
    ExternalPickup:
      description: Use either a saved pickup code or a coordinate pin.
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - savedLocationCode
        properties:
          savedLocationCode:
            type: string
            pattern: ^[A-Z0-9][A-Z0-9_-]{1,63}$
      - $ref: '#/components/schemas/ExternalCoordinate'
    ExternalPickupLocation:
      type: object
      additionalProperties: false
      required:
      - pickupLocationId
      - merchantId
      - branchId
      - code
      - name
      - latitude
      - longitude
      - status
      - timezone
      - openingHours
      - pickupWaves
      properties:
        pickupLocationId:
          $ref: '#/components/schemas/Uuid'
        merchantId:
          $ref: '#/components/schemas/Uuid'
        branchId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
        name:
          type: string
        cityCode:
          type:
          - string
          - 'null'
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        timezone:
          type: string
          example: Asia/Riyadh
          description: IANA zone the opening hours are local to.
        openingHours:
          type: array
          description: Local collection hours per ISO day of week (1 = Monday). Empty means no hours are
            configured.
          items:
            type: object
            additionalProperties: false
            required:
            - dayOfWeek
            - opensAt
            - closesAt
            properties:
              dayOfWeek:
                type: integer
                minimum: 1
                maximum: 7
              opensAt:
                type: string
                example: 08:00:00
              closesAt:
                type: string
                example: '20:00:00'
        pickupWaves:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - waveTime
            properties:
              waveTime:
                type: string
                example: '10:00:00'
              label:
                type:
                - string
                - 'null'
    ExternalPickupLocationPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExternalPickupLocation'
        nextCursor:
          type:
          - string
          - 'null'
    ExternalPickupWindow:
      type: object
      additionalProperties: false
      required:
      - start
      - end
      properties:
        start:
          $ref: '#/components/schemas/InstantUtc'
        end:
          $ref: '#/components/schemas/InstantUtc'
    ExternalProof:
      type: object
      additionalProperties: false
      properties:
        pickedUpAt:
          oneOf:
          - $ref: '#/components/schemas/InstantUtc'
          - type: 'null'
        pickupPhotoPath:
          type:
          - string
          - 'null'
          format: uri-reference
        deliveredAt:
          oneOf:
          - $ref: '#/components/schemas/InstantUtc'
          - type: 'null'
        deliveryProofType:
          type:
          - string
          - 'null'
          enum:
          - PHOTO
          - SIGNATURE
          - null
        deliveryProofPath:
          type:
          - string
          - 'null'
          format: uri-reference
        failureReasonCode:
          type:
          - string
          - 'null'
    ExternalRecipient:
      type: object
      additionalProperties: false
      required:
      - name
      - mobile
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        mobile:
          type: string
          pattern: ^(?:05|5|\\+9665)[0-9]{8}$
          description: Saudi mobile; DropHub stores canonical +9665XXXXXXXX.
    ExternalServiceability:
      type: object
      additionalProperties: false
      required:
      - serviceable
      - evaluatedAt
      properties:
        serviceable:
          type: boolean
        unavailableReasonCode:
          type:
          - string
          - 'null'
          enum:
          - PICKUP_UNAVAILABLE
          - PICKUP_OUTSIDE_OPERATING_HOURS
          - OUTSIDE_MERCHANT_COVERAGE
          - NO_PROVIDER_AVAILABLE
          - null
        evaluatedAt:
          $ref: '#/components/schemas/InstantUtc'
        coverageZoneVersionId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
    ExternalServiceabilityRequest:
      type: object
      additionalProperties: false
      required:
      - pickup
      - destination
      properties:
        pickup:
          $ref: '#/components/schemas/ExternalPickup'
        destination:
          $ref: '#/components/schemas/ExternalCoordinate'
        pickupWindow:
          $ref: '#/components/schemas/ExternalPickupWindow'
    ExternalShipment:
      type: object
      additionalProperties: false
      required:
      - id
      - reference
      - status
      - trackingUrl
      - createdAt
      - version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        reference:
          type: string
        status:
          $ref: '#/components/schemas/ExternalShipmentStatus'
        trackingUrl:
          type: string
          format: uri-reference
        codAmount:
          type:
          - number
          - 'null'
          format: decimal
          minimum: 0
        deliveryFeeAmount:
          type:
          - number
          - 'null'
          format: decimal
          minimum: 0
        deliveryFeeCurrency:
          type:
          - string
          - 'null'
          example: SAR
        eta:
          oneOf:
          - $ref: '#/components/schemas/LiveEta'
          - type: 'null'
        proofAvailable:
          type: boolean
        proofType:
          type:
          - string
          - 'null'
          enum:
          - PHOTO
          - SIGNATURE
          - null
        deliveredAt:
          oneOf:
          - $ref: '#/components/schemas/InstantUtc'
          - type: 'null'
        failureReasonCode:
          type:
          - string
          - 'null'
        cancellationReasonCode:
          type:
          - string
          - 'null'
        driver:
          oneOf:
          - $ref: '#/components/schemas/ExternalAssignedDriver'
          - type: 'null'
        createdAt:
          $ref: '#/components/schemas/InstantUtc'
        version:
          type: integer
          format: int64
          minimum: 0
    ExternalShipmentCancellationRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,47}$
          default: MERCHANT_REQUESTED
    ExternalShipmentChangeRequest:
      type: object
      additionalProperties: false
      description: Include destination, recipient, pickupWindow, or any combination. Absent parts are
        not changed.
      properties:
        destination:
          $ref: '#/components/schemas/ExternalCoordinate'
        recipient:
          $ref: '#/components/schemas/ExternalRecipient'
        pickupWindow:
          $ref: '#/components/schemas/ExternalPickupWindow'
    ExternalShipmentRequest:
      type: object
      additionalProperties: false
      required:
      - reference
      - pickup
      - destination
      - recipient
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 128
          description: Merchant order/reference number and default idempotency key.
        pickup:
          $ref: '#/components/schemas/ExternalPickup'
        destination:
          $ref: '#/components/schemas/ExternalCoordinate'
        recipient:
          $ref: '#/components/schemas/ExternalRecipient'
        parcel:
          $ref: '#/components/schemas/ExternalParcel'
        codAmount:
          type: number
          format: decimal
          exclusiveMinimum: 0
          multipleOf: 0.01
          description: Omit for prepaid shipments; currency is SAR.
        pickupWindow:
          $ref: '#/components/schemas/ExternalPickupWindow'
        quoteId:
          description: A quote from POST /api/v2/external/quotes; the shipment is then charged its price.
          $ref: '#/components/schemas/Uuid'
    ExternalShipmentStatus:
      type: string
      enum:
      - CREATED
      - ASSIGNED
      - PICKED_UP
      - OUT_FOR_DELIVERY
      - DELIVERED
      - FAILED
      - NO_DRIVER_AVAILABLE
      - CANCELLED
      description: ASSIGNED covers an offer awaiting the driver's acceptance and an accepted one. NO_DRIVER_AVAILABLE
        means the bounded driver search ended without a driver; the shipment can still be cancelled.
    ExternalTracking:
      type: object
      additionalProperties: false
      required:
      - id
      - reference
      - status
      - locationStatus
      - recommendedRefreshSeconds
      - history
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        reference:
          type: string
        status:
          $ref: '#/components/schemas/ExternalShipmentStatus'
        driverLocation:
          oneOf:
          - $ref: '#/components/schemas/ExternalMapLocation'
          - type: 'null'
        locationStatus:
          type: string
          enum:
          - NOT_ASSIGNED
          - WAITING_FOR_DRIVER_ACCEPTANCE
          - LOCATION_UNAVAILABLE
          - AVAILABLE
          - STALE
          - TERMINAL_NO_LIVE_LOCATION
        recommendedRefreshSeconds:
          type: integer
          format: int64
          minimum: 5
          maximum: 60
        history:
          type: array
          items:
            $ref: '#/components/schemas/ExternalTrackingStep'
        eta:
          oneOf:
          - $ref: '#/components/schemas/LiveEta'
          - type: 'null'
        driver:
          oneOf:
          - $ref: '#/components/schemas/ExternalAssignedDriver'
          - type: 'null'
    ExternalTrackingStep:
      type: object
      additionalProperties: false
      required:
      - status
      - at
      properties:
        status:
          $ref: '#/components/schemas/ExternalShipmentStatus'
        at:
          $ref: '#/components/schemas/InstantUtc'
    ExternalWebhook:
      type: object
      additionalProperties: false
      required:
      - endpointId
      - url
      - status
      - subscribedEventTypes
      - version
      - createdAt
      - updatedAt
      properties:
        endpointId:
          $ref: '#/components/schemas/Uuid'
        url:
          type: string
          format: uri
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
        subscribedEventTypes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ExternalWebhookEventType'
        previousSecretValidUntil:
          oneOf:
          - $ref: '#/components/schemas/InstantUtc'
          - type: 'null'
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/InstantUtc'
        updatedAt:
          $ref: '#/components/schemas/InstantUtc'
    ExternalWebhookEventType:
      type: string
      enum:
      - shipment.created
      - shipment.assigned
      - shipment.picked_up
      - shipment.out_for_delivery
      - shipment.delivered
      - shipment.failed
      - shipment.cancelled
      - shipment.no_driver_available
      - shipment.updated
      - shipment.eta_updated
      description: 'shipment.eta_updated carries data.eta {target: PICKUP|DELIVERY, estimatedArrivalAt};
        it is sent when a driver leg gets its first estimate and whenever the estimate moves by at least
        the platform setting dispatch.tracking.eta-notify-threshold (default 5 minutes). shipment.updated
        is sent when the merchant changes the destination or recipient through PATCH /api/v2/external/shipments/{shipmentId};
        lifecycleState is unchanged. An endpoint created without an explicit list subscribes to every
        type; existing endpoints keep the list they were created with. Every event''s data carries status,
        the same ExternalShipmentStatus the shipment read returns; lifecycleState is DropHub''s internal
        state, kept for existing receivers.'
    ExternalWebhookPatch:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
        events:
          type: array
          uniqueItems: true
          maxItems: 10
          items:
            $ref: '#/components/schemas/ExternalWebhookEventType'
    ExternalWebhookRequest:
      type: object
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          uniqueItems: true
          maxItems: 10
          items:
            $ref: '#/components/schemas/ExternalWebhookEventType'
          description: Omit to subscribe to every event.
    ExternalWebhookSecret:
      type: object
      additionalProperties: false
      required:
      - webhook
      - signingSecret
      properties:
        webhook:
          $ref: '#/components/schemas/ExternalWebhook'
        signingSecret:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
          description: Base64URL-encoded 32-byte HMAC-SHA256 secret, returned on create or rotation.
    InstantUtc:
      type: string
      format: date-time
    Latitude:
      type: number
      minimum: -90
      maximum: 90
      multipleOf: 1.0e-06
    LiveEta:
      type: object
      additionalProperties: false
      required:
      - target
      - estimatedArrivalAt
      - estimatedMinutes
      - calculatedAt
      - distanceMetres
      properties:
        target:
          type: string
          enum:
          - PICKUP
          - DELIVERY
        estimatedArrivalAt:
          $ref: '#/components/schemas/InstantUtc'
        estimatedMinutes:
          type: integer
          format: int64
        calculatedAt:
          $ref: '#/components/schemas/InstantUtc'
        distanceMetres:
          type: integer
          format: int64
    Longitude:
      type: number
      minimum: -180
      maximum: 180
      multipleOf: 1.0e-06
    Problem:
      type: object
      description: RFC 9457 Problem Details with stable DropHub extensions
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - timestamp
      - correlationId
      - requestId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 128
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 512
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        violations:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Violation'
      example:
        type: https://api.drophub.example/problems/access-denied
        title: Access denied
        status: 403
        detail: Access to this resource is denied.
        instance: /api/v2/external/shipments/018f2d8a-1f00-7000-8000-000000000206
        code: ACCESS_DENIED
        timestamp: '2026-08-22T18:30:00Z'
        correlationId: 018f2d8a-1f00-7000-8000-000000000207
        requestId: 018f2d8a-1f00-7000-8000-000000000208
    PublicTracking:
      type: object
      additionalProperties: false
      required:
      - status
      - locationStatus
      - recommendedRefreshSeconds
      - history
      properties:
        status:
          $ref: '#/components/schemas/ExternalShipmentStatus'
        driverLocation:
          description: Coarse position only; exact position and accuracy are never public.
          oneOf:
          - $ref: '#/components/schemas/ExternalMapLocation'
          - type: 'null'
        locationStatus:
          type: string
          enum:
          - NOT_ASSIGNED
          - WAITING_FOR_DRIVER_ACCEPTANCE
          - LOCATION_UNAVAILABLE
          - AVAILABLE
          - STALE
          - TERMINAL_NO_LIVE_LOCATION
        recommendedRefreshSeconds:
          type: integer
          format: int64
          minimum: 5
          maximum: 60
        history:
          type: array
          items:
            $ref: '#/components/schemas/ExternalTrackingStep'
    SandboxDeliveryFailureRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,47}$
          example: CUSTOMER_UNREACHABLE
    SandboxFixtureCoordinate:
      type: object
      additionalProperties: false
      required:
      - latitude
      - longitude
      properties:
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
    SandboxReadiness:
      type: object
      additionalProperties: false
      required:
      - generation
      - canCreateShipment
      - nextShipmentDispatchHeld
      - branchCode
      - pickupLocationCode
      - pickup
      - delivery
      - destinationCityCode
      - sandboxDriverPhone
      - prerequisites
      properties:
        generation:
          type: integer
          minimum: 1
        canCreateShipment:
          type: boolean
        nextShipmentDispatchHeld:
          type: boolean
          description: True when the next sandbox shipment will remain before any driver offer; consumed
            atomically by that creation.
        branchCode:
          type: string
          const: SANDBOX_BRANCH
        pickupLocationCode:
          type: string
          const: SANDBOX_PICKUP
        pickup:
          $ref: '#/components/schemas/SandboxFixtureCoordinate'
        delivery:
          $ref: '#/components/schemas/SandboxFixtureCoordinate'
        destinationCityCode:
          type: string
          const: SANDBOX_RUH
          description: Derived fixture coverage context; shipment requests need only coordinates.
        sandboxDriverPhone:
          type: string
          pattern: ^05[0-9]{8}$
          description: Sandbox-only driver OTP identity used to progress the real canonical driver lifecycle.
        prerequisites:
          type: array
          items:
            $ref: '#/components/schemas/SandboxReadinessItem'
    SandboxReadinessItem:
      type: object
      additionalProperties: false
      required:
      - prerequisite
      - ready
      properties:
        prerequisite:
          type: string
          enum:
          - merchant
          - branch
          - pickupLocation
          - coverage
          - commercialTerms
          - eligibleCarrier
          - dispatchableDriver
          - freshCanonicalLocation
          - routingCoordinates
        ready:
          type: boolean
    ShipmentPriceEstimate:
      type: object
      additionalProperties: false
      required:
      - distanceMetres
      - durationSeconds
      - price
      - routeGeometry
      - routeGeometryFormat
      properties:
        distanceMetres:
          type: integer
          format: int64
          minimum: 0
        durationSeconds:
          type: integer
          format: int64
          minimum: 0
        price:
          type: object
          additionalProperties: false
          required:
          - amount
          - currency
          properties:
            amount:
              type: number
            currency:
              type: string
              example: SAR
        routeGeometry:
          type: string
        routeGeometryFormat:
          type: string
        quoteId:
          description: Present only on POST /api/v2/external/quotes; null on non-binding estimates.
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        expiresAt:
          description: When the quoteId stops being accepted at shipment creation.
          oneOf:
          - $ref: '#/components/schemas/InstantUtc'
          - type: 'null'
    ShipmentPriceEstimateRequest:
      type: object
      additionalProperties: false
      description: The pickup is a saved branch and pickup location, or an exact pickup point; a point,
        when given, is what the route is measured from.
      required:
      - merchantId
      - destinationLatitude
      - destinationLongitude
      properties:
        merchantId:
          type: string
          format: uuid
        branchId:
          type:
          - string
          - 'null'
          format: uuid
        pickupLocationId:
          type:
          - string
          - 'null'
          format: uuid
        destinationLatitude:
          type: number
          minimum: -90
          maximum: 90
        destinationLongitude:
          type: number
          minimum: -180
          maximum: 180
        pickupLatitude:
          type:
          - number
          - 'null'
          minimum: -90
          maximum: 90
          description: The exact pickup point, when one was chosen; the location's own otherwise.
        pickupLongitude:
          type:
          - number
          - 'null'
          minimum: -180
          maximum: 180
    Uuid:
      type: string
      format: uuid
    Violation:
      type: object
      additionalProperties: false
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
          maxLength: 128
        code:
          type: string
          maxLength: 64
        message:
          type: string
          maxLength: 256
  securitySchemes:
    oauthClientCredentials:
      type: oauth2
      description: OAuth 2.0 client-credentials flow for external machine-to-machine integrations.
      flows:
        clientCredentials:
          tokenUrl: /api/v2/oauth/token
          scopes:
            quotes:write: Calculate shipment quotes without creating shipments
            shipments:read: Read Merchant-owned shipments
            shipments:write: Create and cancel Merchant-owned shipments
            tracking:read: Read merchant-owned shipment tracking projections
            webhooks:manage: Configure and rotate the merchant's single signed shipment webhook
