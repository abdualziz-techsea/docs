        reasonCode: CUSTOMER_REQUESTED
    ExternalShipmentItemRequest:
      type: object
      additionalProperties: false
      required:
      - description
      - quantity
      - weightKilograms
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 160
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
        weightKilograms:
          type: number
          exclusiveMinimum: 0
        lengthCentimetres:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
        widthCentimetres:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
        heightCentimetres:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
    ExternalShipmentPage:
      type: object
      required:
      - data
      - page
      - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExternalShipment'
        page:
          $ref: '#/components/schemas/PageMetadata'
        links:
          $ref: '#/components/schemas/PageLinks'
    ExternalShipmentPriceEstimate:
      type: object
      additionalProperties: false
      description: What this merchant will be charged for this delivery. DropHub's carrier decision and
        commercial margin are internal and deliberately absent.
      required:
      - distanceMetres
      - price
      - currency
      properties:
        distanceMetres:
          type: integer
          format: int64
          minimum: 1
        price:
          type: number
          format: decimal
          minimum: 0
          multipleOf: 0.01
          description: The delivery price currently agreed with this merchant.
        currency:
          type: string
          enum:
          - SAR
    ExternalShipmentPriceEstimateRequest:
      type: object
      additionalProperties: false
      required:
      - pickup
      - delivery
      - destinationCityCode
      properties:
        pickup:
          $ref: '#/components/schemas/Coordinate'
        delivery:
          $ref: '#/components/schemas/Coordinate'
        destinationCityCode:
          type: string
          pattern: ^[A-Z0-9_-]{2,32}$
      example:
        pickup:
          latitude: 24.7136
          longitude: 46.6753
        delivery:
          latitude: 24.774265
          longitude: 46.738586
        destinationCityCode: RUH
    ExternalShipmentRequest:
      type: object
      additionalProperties: false
      required:
      - externalReference
      - branchCode
      - pickupLocationCode
      - recipient
      - destination
      - declaredValue
      - codAmount
      - currency
      - paymentMethod
      - pickupWindowStart
      - pickupWindowEnd
      - items
      - requirements
      properties:
        externalReference:
          type: string
          minLength: 1
          maxLength: 128
        branchCode:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_-]{1,63}$
        pickupLocationCode:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_-]{1,63}$
        recipient:
          $ref: '#/components/schemas/ExternalRecipient'
        destination:
          $ref: '#/components/schemas/ExternalLocation'
        declaredValue:
          type: number
          format: decimal
          minimum: 0
        codAmount:
          type: number
          format: decimal
          minimum: 0
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        paymentMethod:
          type: string
          enum:
          - PREPAID
          - COD
        pickupWindowStart:
          $ref: '#/components/schemas/InstantUtc'
        pickupWindowEnd:
          $ref: '#/components/schemas/InstantUtc'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ExternalShipmentItemRequest'
        requirements:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{1,47}$
    ExternalTracking:
      type: object
      additionalProperties: false
      required:
      - shipmentId
      - lifecycleState
      - locationStatus
      - recommendedRefreshSeconds
      properties:
        shipmentId:
          $ref: '#/components/schemas/Uuid'
        lifecycleState:
          $ref: '#/components/schemas/ShipmentState'
        driverLocation:
          type:
          - object
          - 'null'
          properties:
            latitude:
              $ref: '#/components/schemas/Latitude'
            longitude:
              $ref: '#/components/schemas/Longitude'
            accuracyMetres:
              type:
              - number
              - 'null'
              minimum: 0
            recordedAt:
              $ref: '#/components/schemas/InstantUtc'
            stale:
              type: boolean
            ageSeconds:
              type: integer
              minimum: 0
        locationStatus:
          type: string
          enum:
          - NOT_ASSIGNED
          - WAITING_FOR_DRIVER_ACCEPTANCE
          - LOCATION_UNAVAILABLE
          - AVAILABLE
          - STALE
          - TERMINAL_NO_LIVE_LOCATION
        recommendedRefreshSeconds:
          type: integer
          minimum: 5
          maximum: 60
    InstantUtc:
      type: string
      format: date-time
      x-java-type: java.time.Instant
      x-postgresql-type: timestamptz(6)
      x-time-semantics: UTC-instant
    IssuedMerchantApiSecret:
      description: The one and only disclosure of a secret. What is stored is a peppered digest, so this
        value cannot be produced again and a lost secret is rotated rather than looked up.
      type: object
      additionalProperties: false
      required:
      - merchantId
      - clientId
      - clientSecret
      - version
      properties:
        merchantId:
          $ref: '#/components/schemas/Uuid'
        clientId:
          type: string
          maxLength: 64
        clientSecret:
          type: string
          maxLength: 128
        version:
          type: integer
          format: int64
          minimum: 0
    Latitude:
      type: number
      minimum: -90
      maximum: 90
      multipleOf: 1.0e-06
      x-java-type: java.math.BigDecimal
      x-postgresql-type: numeric(9,6)
      x-unit: decimal-degrees
    Longitude:
      type: number
      minimum: -180
      maximum: 180
      multipleOf: 1.0e-06
      x-java-type: java.math.BigDecimal
      x-postgresql-type: numeric(10,6)
      x-unit: decimal-degrees
    MerchantApiCredential:
      description: The credential as it stands. Never carries a secret.
      type: object
      additionalProperties: false
      required:
      - merchantId
      - clientId
      - environment
      - status
      - scopes
      - secretCreatedAt
      - version
      properties:
        merchantId:
          $ref: '#/components/schemas/Uuid'
        clientId:
          type: string
          maxLength: 64
        environment:
          type: string
          enum:
          - SANDBOX
          - PRODUCTION
        purpose:
          type:
          - string
          - 'null'
          maxLength: 120
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - REVOKED
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
        secretCreatedAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
    MerchantApiCredentialRequest:
      type: object
      additionalProperties: false
      required:
      - scopes
      properties:
        purpose:
          type:
          - string
          - 'null'
          maxLength: 120
        scopes:
          description: What the merchant grants the credential it issues for itself. A self-issued credential
            must never out-rank its issuer, so the Direct API surface is all that is on offer.
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            enum:
            - shipments:read
            - shipments:write
            - webhooks:manage
    MerchantRegistrationRequest:
      type: object
      additionalProperties: false
      description: The merchant sign-up form, field for field. A merchant signs no agreement here; the
        signed agreement belongs to the shipping-company door.
      required:
      - email
      - storeName
      - legalBasis
      - fullName
      - mobileNumber
      - deviceReference
      properties:
        email:
          type: string
          maxLength: 254
        storeName:
          type: string
          minLength: 2
          maxLength: 160
        legalBasis:
          type: string
          enum:
          - COMMERCIAL_ENTITY
          - FREELANCER
        commercialRegistrationNumber:
          description: Required for COMMERCIAL_ENTITY and forbidden for FREELANCER.
          type:
          - string
          - 'null'
          pattern: ^[0-9]{10}$
        fullName:
          type: string
          minLength: 2
          maxLength: 160
        mobileNumber:
          description: Saudi mobile as it is typed, without the country code.
          type: string
          pattern: ^5[0-9]{8}$
        deviceReference:
          type: string
          format: uuid
    PageLinks:
      type: object
      required:
      - self
      additionalProperties: false
      properties:
        self:
          type: string
          maxLength: 512
          description: Safe path of the originating query, without secrets or credentials.
    PageMetadata:
      type: object
      required:
      - limit
      - hasMore
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: The bounded limit the server actually applied.
        nextCursor:
          oneOf:
          - type: string
            maxLength: 256
          - type: 'null'
          description: Continuation token, or null when the result set is exhausted.
        hasMore:
          type: boolean
          description: Always equal to (nextCursor is not null).
      examples:
      - limit: 25
        nextCursor: null
        hasMore: false
    PositiveQuantity:
      type: number
      exclusiveMinimum: 0
      multipleOf: 1.0e-06
      x-java-type: java.math.BigDecimal
      x-postgresql-type: numeric(19,6)
    Problem:
      type: object
      description: RFC 9457 Problem Details with stable DropHub extensions
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - timestamp
      - correlationId
      - requestId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 128
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 512
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
        violations:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Violation'
      example:
        type: https://api.drop-hub.com/problems/access-denied
        title: Access denied
        status: 403
        detail: Access to this resource is denied.
        instance: /v2/external/shipments/018f2d8a-1f00-7000-8000-000000000206
        code: ACCESS_DENIED
        timestamp: '2026-08-22T18:30:00Z'
        correlationId: 018f2d8a-1f00-7000-8000-000000000207
        requestId: 018f2d8a-1f00-7000-8000-000000000208
    RegistrationAcknowledgement:
      type: object
